<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="70" y1="260" x2="1530" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#8A6DFF"/><stop offset=".5" stop-color="#498CFF"/><stop offset="1" stop-color="#32E2B7"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".35"/></filter>
</defs>
<rect width="1600" height="520" rx="30" fill="#090B0F"/>
<text x="70" y="72" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#778194" letter-spacing="3">HOW A SESSION WORKS</text>
<path d="M180 270H1420" stroke="url(#g)" stroke-width="4" stroke-linecap="round" opacity=".5"/>
<g font-family="Inter,Arial,sans-serif" filter="url(#s)">
  <g transform="translate(70 145)"><rect width="250" height="250" rx="24" fill="#11151C" stroke="#303746"/><circle cx="42" cy="42" r="18" fill="#8A6DFF"/><text x="78" y="49" font-size="20" font-weight="900" fill="white">1. START</text><text x="28" y="102" font-size="15" fill="#A7B0BE">Run the launcher.</text><text x="28" y="132" font-size="15" fill="#A7B0BE">A fresh GPU Pod</text><text x="28" y="160" font-size="15" fill="#A7B0BE">is created with</text><text x="28" y="188" font-size="15" fill="#A7B0BE">ephemeral storage only.</text></g>
  <g transform="translate(373 145)"><rect width="250" height="250" rx="24" fill="#11151C" stroke="#303746"/><circle cx="42" cy="42" r="18" fill="#687EFF"/><text x="78" y="49" font-size="20" font-weight="900" fill="white">2. LOAD</text><text x="28" y="102" font-size="15" fill="#A7B0BE">Pick LTX, Wan or</text><text x="28" y="132" font-size="15" fill="#A7B0BE">SkyReels. Only the</text><text x="28" y="160" font-size="15" fill="#A7B0BE">model you actually use</text><text x="28" y="188" font-size="15" fill="#A7B0BE">downloads to the Pod.</text></g>
  <g transform="translate(676 145)"><rect width="250" height="250" rx="24" fill="#11151C" stroke="#303746"/><circle cx="42" cy="42" r="18" fill="#4D9FFF"/><text x="78" y="49" font-size="20" font-weight="900" fill="white">3. RENDER</text><text x="28" y="102" font-size="15" fill="#A7B0BE">Queue dozens of clips.</text><text x="28" y="132" font-size="15" fill="#A7B0BE">Two creators can work</text><text x="28" y="160" font-size="15" fill="#A7B0BE">inside the same session</text><text x="28" y="188" font-size="15" fill="#A7B0BE">at the same time.</text></g>
  <g transform="translate(979 145)"><rect width="250" height="250" rx="24" fill="#11151C" stroke="#303746"/><circle cx="42" cy="42" r="18" fill="#3CCCB6"/><text x="78" y="49" font-size="20" font-weight="900" fill="white">4. EXPORT</text><text x="28" y="102" font-size="15" fill="#A7B0BE">Every output becomes</text><text x="28" y="132" font-size="15" fill="#A7B0BE">720×1280 H.264 and</text><text x="28" y="160" font-size="15" fill="#A7B0BE">ordinary metadata is</text><text x="28" y="188" font-size="15" fill="#A7B0BE">removed automatically.</text></g>
  <g transform="translate(1282 145)"><rect width="250" height="250" rx="24" fill="#11151C" stroke="#303746"/><circle cx="42" cy="42" r="18" fill="#32E2B7"/><text x="78" y="49" font-size="20" font-weight="900" fill="white">5. KILL</text><text x="28" y="102" font-size="15" fill="#A7B0BE">Download everything.</text><text x="28" y="132" font-size="15" fill="#A7B0BE">Terminate the Pod.</text><text x="28" y="160" font-size="15" fill="#A7B0BE">No network volume.</text><text x="28" y="188" font-size="15" font-weight="800" fill="#DDFBF3">Idle Runpod cost: $0.</text></g>
</g>
</svg>