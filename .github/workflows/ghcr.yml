name: Build container
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile','requirements.txt','app/**','static/**','scripts/**']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ github.ref_name == 'main' && 'Dockerfile' || 'Dockerfile.worker' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ugc-factory:${{ github.ref_name == 'main' && 'latest' || 'session-safety' }}
            ghcr.io/${{ github.repository_owner }}/ugc-factory:sha-${{ github.sha }}
